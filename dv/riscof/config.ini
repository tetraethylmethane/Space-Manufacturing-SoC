; RISCOF configuration: Ibex (Verilator) as the device under test, Sail as the reference.
; Paths are relative to this directory; util/run_riscof.sh runs RISCOF from here.

[RISCOF]
ReferencePlugin=sail
ReferencePluginPath=sail
DUTPlugin=ibex
DUTPluginPath=ibex

[ibex]
pluginpath=ibex
ispec=ibex/ibex_isa.yaml
pspec=ibex/ibex_platform.yaml
sim=~/space-am-soc-sim-riscof/sim_riscof-verilator/Vtop_verilator
target_run=1
jobs=4
timeout=60

[sail]
pluginpath=sail
PATH=~/tools/sail/bin
; Make Sail behave like Ibex where the spec allows a choice (mtvec mode and alignment, ebreak mtval).
config_override=ibex.json
jobs=4
